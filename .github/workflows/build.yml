name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  QT_VERSION: '6.8.0'
  BUILD_TYPE: Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Deploy
        shell: pwsh
        run: |
          mkdir deploy
          cp build/${{ env.BUILD_TYPE }}/MusicPlayer.exe deploy/
          cd deploy
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw --qmldir ../resources/qml MusicPlayer.exe
          # Remove unnecessary files
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue imageformats/qgif.dll, imageformats/qico.dll, imageformats/qsvg.dll
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue iconengines, networkinformation, tls
          # Create archive
          Compress-Archive -Path * -DestinationPath ../MusicPlayer-windows-x64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-windows-x64
          path: MusicPlayer-windows-x64.zip

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libegl1-mesa-dev libfuse2

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia
          cache: true

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j$(nproc)

      - name: Deploy
        run: |
          mkdir -p deploy/usr/bin deploy/usr/share/applications deploy/usr/share/icons/hicolor/256x256/apps
          cp build/MusicPlayer deploy/usr/bin/
          # Create .desktop file
          cat > deploy/usr/share/applications/MusicPlayer.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=MusicPlayer
          Exec=MusicPlayer
          Icon=musicplayer
          Categories=Audio;Music;Player;
          EOF
          # Download linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export QMAKE=$Qt6_DIR/bin/qmake
          export QML_SOURCES_PATHS=${{ github.workspace }}/resources/qml
          export EXTRA_QT_PLUGINS="multimedia"
          ./linuxdeploy-x86_64.AppImage --appdir deploy --plugin qt --output appimage || true
          # Fallback: create tarball if AppImage fails
          if ls MusicPlayer*.AppImage 1>/dev/null 2>&1; then
            mv MusicPlayer*.AppImage MusicPlayer-linux-x64.AppImage
          else
            tar -czvf MusicPlayer-linux-x64.tar.gz -C build MusicPlayer
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-linux-x64
          path: MusicPlayer-linux-x64.*

  build-macos:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          cache: true

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j$(sysctl -n hw.ncpu)

      - name: Deploy
        run: |
          cd build
          # Check if .app bundle exists
          if [ -d "MusicPlayer.app" ]; then
            macdeployqt MusicPlayer.app -qmldir=../resources/qml -always-overwrite
            # Remove unnecessary plugins
            rm -rf MusicPlayer.app/Contents/PlugIns/iconengines || true
            rm -rf MusicPlayer.app/Contents/PlugIns/tls || true
            # Create DMG
            hdiutil create -volname "MusicPlayer" -srcfolder MusicPlayer.app -ov -format UDZO ../MusicPlayer-macos-x64.dmg
          else
            # Fallback: zip the binary
            zip ../MusicPlayer-macos-x64.zip MusicPlayer
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-macos-x64
          path: MusicPlayer-macos-x64.*

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            MusicPlayer-windows-x64/*
            MusicPlayer-linux-x64/*
            MusicPlayer-macos-x64/*
          generate_release_notes: true
